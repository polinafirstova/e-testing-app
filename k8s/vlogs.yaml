apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
  labels:
    app: victoria-logs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-logs
  template:
    metadata:
      labels:
        app: victoria-logs
    spec:
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9428
              name: http
          args:
            - "-retentionPeriod=7d"
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  labels:
    app: victoria-logs
spec:
  selector:
    app: victoria-logs
  ports:
    - protocol: TCP
      port: 9428
      targetPort: 9428
      name: http
